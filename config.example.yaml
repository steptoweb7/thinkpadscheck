# Local secrets only -- NOT tracked in git (see .gitignore). Copy this
# file to config.yaml and fill in your Gmail credentials. Every other
# setting (prices, models, URLs) lives in settings.yaml instead, which
# IS tracked in git, so changes to those arrive with a plain `git pull`.
gmail:
  address: "your_email@gmail.com"
  app_password: "your_16_char_app_password"
  to: "your_email@gmail.com"

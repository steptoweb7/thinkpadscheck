filter_url: "https://www.olx.ro/electronice-si-electrocasnice/laptop-calculator-gaming/laptopuri/?search%5Bfilter_float_price%3Ato%5D=1500&search%5Border%5D=created_at%3Adesc"
max_price: 1500
db_path: "seen_listings.db"

reference_prices:
  "ThinkPad T480": 1800
  "ThinkPad T490": 2000
  "ThinkPad T14": 2200
  "ThinkPad X13": 2100
  "ThinkPad P14s": 2400
  "Latitude 5490": 1600
  "EliteBook 840": 1700

# Second, independent alert rule: ignores CPU/RAM/model entirely — just a
# real SSD (not HDD) of at least min_ssd_gb, at a throwaway price. Catches
# sellers who don't realize how much their SSD alone is worth right now.
ssd_deal:
  filter_urls:
    - "https://www.olx.ro/electronice-si-electrocasnice/laptop-calculator-gaming/laptopuri/?search%5Border%5D=created_at%3Adesc"
    - "https://www.olx.ro/electronice-si-electrocasnice/laptop-calculator-gaming/sisteme-pc-si-gaming/?search%5Border%5D=created_at%3Adesc"
    - "https://www.olx.ro/electronice-si-electrocasnice/componente-laptop-pc/hard-disk-uri/?search%5Border%5D=created_at%3Adesc"
  max_price: 800
  min_ssd_gb: 512
  # Standalone drives (sold as a bare component, not inside a laptop/PC)
  # use THIS tiered pricing instead of max_price above -- a bare drive
  # isn't "seller doesn't realize the SSD is valuable" arbitrage, they're
  # selling exactly the drive at market rate, so the bar is much lower
  # and scales with capacity. Above the largest tier, price scales
  # linearly using the rate between the two largest tiers.
  standalone_drive_max_price_by_gb:
    512: 150
    1000: 200
    2000: 300


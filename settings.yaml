# Tracked in git -- no secrets here. Every tuning knob in this file
# takes effect on the deployment machine after a plain `git pull`, no
# manual editing needed. Gmail credentials live only in config.yaml
# (gitignored), which is merged on top of this file at load time.

filter_url: "https://www.olx.ro/electronice-si-electrocasnice/laptop-calculator-gaming/laptopuri/?search%5Bfilter_float_price%3Ato%5D=1800&search%5Border%5D=created_at%3Adesc"
max_price: 1800
db_path: "seen_listings.db"

# Prices below reflect real OLX private-seller asking prices checked
# 2026-09-12 for a typical qualifying spec (16GB RAM, matching SSD size,
# gen 11+ CPU where the model requires it). Used only to compute the
# score_pct shown in alert emails, not as an exclusion threshold.
reference_prices:
  "ThinkPad T480": 900     # observed 700-1300 lei (i5/i7 gen8, 8-32GB, 256-512GB)
  "ThinkPad T490": 900     # observed 600-1100 lei (i5/i7 gen8, 16GB, 256-512GB)
  "ThinkPad T14": 1500     # observed 1300-2019 lei (i5-1145G7-class, 16GB, 256-512GB)
  "ThinkPad X13": 1500     # observed 1100-1789 lei (gen11, 16GB, 256GB)
  "ThinkPad P14s": 1800    # observed 1300-3099 lei (gen11+, used); most affordable units cluster near the low end
  "Latitude 5490": 800     # observed 450-1000 lei (i3/i5 gen7-8, 8GB, 128-512GB)
  "EliteBook 840": 1300    # observed 1050-1500 lei (gen11-13 G8/G9/G10 only, 16GB, 256-512GB)

# Second, independent alert rule: ignores CPU/RAM/model entirely — just a
# real SSD (not HDD) of at least min_ssd_gb, at a throwaway price. Catches
# sellers who don't realize how much their SSD alone is worth right now.
ssd_deal:
  filter_urls:
    - "https://www.olx.ro/electronice-si-electrocasnice/laptop-calculator-gaming/laptopuri/?search%5Border%5D=created_at%3Adesc"
    - "https://www.olx.ro/electronice-si-electrocasnice/laptop-calculator-gaming/sisteme-pc-si-gaming/?search%5Border%5D=created_at%3Adesc"
    - "https://www.olx.ro/electronice-si-electrocasnice/componente-laptop-pc/hard-disk-uri/?search%5Border%5D=created_at%3Adesc"
  max_price: 800
  min_ssd_gb: 512
  # Standalone drives (sold as a bare component, not inside a laptop/PC)
  # are judged against a LIVE market median instead of max_price above --
  # a bare drive isn't "seller doesn't realize the SSD is valuable"
  # arbitrage, they're selling exactly the drive, so the bar is whatever
  # the real current market price for that exact capacity is. The bot
  # builds this median itself over time from every standalone-drive
  # price it observes (see ssd_price_observations in seen_listings.db).
  # min_samples: don't alert on a capacity until at least this many real
  # prices have been observed for it (a median from 1-2 ads is noise).
  # discount_threshold: alert only if price <= median * this (0.6 = 40%+ off).
  min_samples: 5
  discount_threshold: 0.6
